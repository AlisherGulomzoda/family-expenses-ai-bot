# Web panel: static SPA + reverse proxy for the API.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS; re-resolving "api" survives container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # REST API -> backend. The request ID ties nginx and API logs together.
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Liveness of nginx itself (Docker healthcheck).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA: every other path is the app; index.html is never cached so a new
    # build is picked up on the next load. Filters live in the query string.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

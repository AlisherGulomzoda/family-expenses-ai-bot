version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    staticcheck:
      checks:
        - all
        # defaults disabled by golangci-lint
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # keep explicit selectors like cfg.LLM.Model: they say which config section a field belongs to
        - -QF1008
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may use simplified error handling and fixed test data.
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AlisherGulomzoda/family-expenses-ai-bot

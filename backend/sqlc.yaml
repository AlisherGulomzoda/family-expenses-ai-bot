version: "2"
sql:
  - engine: postgresql
    # sqlc understands goose annotations and applies only the Up sections.
    schema: migrations
    queries: internal/postgres/queries
    gen:
      go:
        package: sqlcdb
        out: internal/postgres/sqlcdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
